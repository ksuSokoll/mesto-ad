name: Deploy to Public Pages Repository

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npm run build

      - name: Deploy
        env:
          TOKEN: ${{ secrets.PUBLIC_PAGES_TOKEN }}
          REPO: ${{ secrets.PUBLIC_PAGES_REPO }}
        run: |
          git config --global --unset-all http.https://github.com/.extraheader || true
          git clone https://x-access-token:${TOKEN}@github.com/${REPO}.git public-repo
          cd public-repo
          git checkout -b main || git checkout main
          cp -r ../dist/* .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "deploy: update build" || echo "No changes to commit"
          git push origin main

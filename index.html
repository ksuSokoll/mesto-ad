<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesto</title>
  <link rel="stylesheet" href="./index.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <img class="header__logo" src="./images/logo.svg" alt="Логотип Mesto" />
    </header>
    <main class="content">
      <section class="profile page__section">
        <div class="profile__image"></div>
        <div class="profile__info">
          <h1 class="profile__title"></h1>
          <p class="profile__description"></p>
          <button class="profile__edit-button" type="button" aria-label="Редактировать профиль"></button>
        </div>
        <button class="profile__add-button" type="button" aria-label="Добавить карточку"></button>
      </section>
      <section class="elements page__section">
        <div class="places__list"></div>
      </section>
    </main>
    <footer class="footer page__section">
      <p class="footer__copyright">© 2023 Mesto</p>
    </footer>
  </div>

  <!-- Шаблон карточки -->
  <template id="card-template">
    <article class="card">
      <img class="card__image" src="#" alt="#" />
      <button class="card__delete-button" type="button" aria-label="Удалить карточку"></button>
      <div class="card__description">
        <h2 class="card__title"></h2>
        <div class="card__likes">
          <button class="card__like-button" type="button" aria-label="Поставить лайк"></button>
          <span class="card__like-count"></span>
        </div>
      </div>
    </article>
  </template>

  <!-- Модальное окно редактирования профиля -->
  <div class="popup popup_type_edit">
    <div class="popup__content">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Редактировать профиль</h2>
      <form class="popup__form" name="edit-profile" novalidate>
        <label class="popup__label">
          <input
            type="text"
            name="name"
            id="name"
            class="popup__input popup__input_type_name"
            placeholder="Имя"
            required
            minlength="2"
            maxlength="40"
            pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
            data-error-message="Разрешены только буквы, дефис и пробел"
          />
          <span class="popup__error" id="name-error"></span>
        </label>
        <label class="popup__label">
          <input
            type="text"
            name="about"
            id="about"
            class="popup__input popup__input_type_description"
            placeholder="О себе"
            required
            minlength="2"
            maxlength="200"
          />
          <span class="popup__error" id="about-error"></span>
        </label>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно добавления карточки -->
  <div class="popup popup_type_add">
    <div class="popup__content">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Новое место</h2>
      <form class="popup__form" name="new-card" novalidate>
        <label class="popup__label">
          <input
            type="text"
            name="name"
            id="card-name"
            class="popup__input popup__input_type_card-name"
            placeholder="Название"
            required
            minlength="2"
            maxlength="30"
            pattern="^[a-zA-Zа-яА-ЯёЁ\s\-]+$"
            data-error-message="Разрешены только буквы, дефис и пробел"
          />
          <span class="popup__error" id="card-name-error"></span>
        </label>
        <label class="popup__label">
          <input
            type="url"
            name="link"
            id="card-link"
            class="popup__input popup__input_type_url"
            placeholder="Ссылка на картинку"
            required
          />
          <span class="popup__error" id="card-link-error"></span>
        </label>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Создать</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно обновления аватара -->
  <div class="popup popup_type_avatar">
    <div class="popup__content">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <h2 class="popup__title">Обновить аватар</h2>
      <form class="popup__form" name="avatar" novalidate>
        <label class="popup__label">
          <input
            type="url"
            name="avatar"
            id="avatar-link"
            class="popup__input popup__input_type_avatar"
            placeholder="Ссылка на аватар"
            required
          />
          <span class="popup__error" id="avatar-link-error"></span>
        </label>
        <button class="popup__button popup__button_disabled" type="submit" disabled>Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно просмотра изображения -->
  <div class="popup popup_type_image">
    <div class="popup__content popup__content_image">
      <button class="popup__close" type="button" aria-label="Закрыть"></button>
      <img class="popup__image" src="#" alt="#" />
      <p class="popup__caption"></p>
    </div>
  </div>

  <script type="module" src="./src/scripts/index.js"></script>
</body>
</html>
